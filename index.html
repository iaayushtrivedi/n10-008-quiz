<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Networking Fundamentals Quiz</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Networking Fundamentals Quiz</h1>
        
        <div id="nameInput" class="section">
            <h2>Enter Your Name</h2>
            <input type="text" id="name" placeholder="Your Name" aria-label="Your Name">
            <button onclick="startQuiz()">Start Quiz</button>
        </div>

        <div id="timerOption" class="section">
            <h2>Would you like to take the quiz with a timer?</h2>
            <button onclick="startTimerQuiz()">Yes, use timer (30 sec/question)</button>
            <button onclick="startNoTimerQuiz()">No timer</button>
        </div>

        <div id="quiz" class="section" aria-live="polite">
            <div class="timer" id="timer" aria-label="Timer"></div>
            <div class="score">Score: <span id="scoreValue">0</span></div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <h2>Question <span id="questionNumber">1</span></h2>
            <div id="question"></div>
            <div id="optionsContainer" class="options" role="group" aria-labelledby="question"></div>
            <div id="answer" class="answer" role="alert"></div>
            <div class="section">
                <button id="showAnswerBtn" onclick="showAnswer()">Show Answer</button>
                <button id="prevBtn" onclick="prevQuestion()" disabled>Previous</button>
                <button id="nextBtn" onclick="nextQuestion()">Next</button>
            </div>
        </div>

        <div id="results" class="section" style="display: none;">
            <h2>Quiz Results</h2>
            <div id="finalScore"></div>
            <button onclick="restartQuiz()">Restart Quiz</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
